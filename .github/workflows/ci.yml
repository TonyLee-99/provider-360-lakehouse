name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Cache Ivy (Delta jars)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-delta-3.2.1
      - run: uv sync --locked
      - name: make check (lint, unit + end-to-end on the real fixture, Dagster definitions, README numbers)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: make check
