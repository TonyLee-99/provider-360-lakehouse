[project]
name = "provider-360-lakehouse"
version = "0.1.0"
description = "Delta Lake medallion pipeline that conforms CMS Open Payments, Medicare Part D and NPPES into one provider master"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyspark==3.5.3",
  "delta-spark==3.2.1",
  "pyarrow>=17",
  "pyyaml>=6",
  "dagster>=1.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "dagster-webserver>=1.9"]

[project.scripts]
p360 = "p360.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p360"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731"]  # long lines are left to the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: needs a local Spark session (JDK 17)", "acceptance: checks results/*.json from the full run"]
